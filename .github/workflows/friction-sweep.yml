name: Friction Sweep

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  friction-sweep:
    uses: bovas85/rig-handover/.github/workflows/reusable-gemini-maintenance.yml@main
    with:
      mode: friction-sweep
      verify_cmd: "yarn verify"
      package_manager: "yarn"
    secrets:
      GEMINI_CLI_LLM: ${{ secrets.GEMINI_CLI_LLM }}
