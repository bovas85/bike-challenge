name: Keep Tests Tight

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  keep-tests-tight:
    uses: bovas85/rig-handover/.github/workflows/reusable-gemini-maintenance.yml@main
    with:
      mode: keep-tests-tight
      verify_cmd: "yarn verify"
      package_manager: "yarn"
    secrets:
      GEMINI_CLI_LLM: ${{ secrets.GEMINI_CLI_LLM }}
